<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interpolation Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:450px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#0077cc;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:48%;
    padding:10px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.search{
    background:#28a745;
}

.clear{
    background:#dc3545;
    float:right;
}

#result{
    margin-top:25px;
    font-size:18px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

    <h2>Interpolation Search</h2>

    <label>Sorted Array</label>
    <input type="text" id="array" placeholder="10,20,30,40,50">

    <label>Search Element</label>
    <input type="number" id="key" placeholder="40">

    <button class="search" onclick="searchElement()">Search</button>
    <button class="clear" onclick="clearFields()">Clear</button>

    <div id="result"></div>

</div>

<script>

function interpolationSearch(arr, key){

    let low = 0;
    let high = arr.length - 1;

    while(low <= high && key >= arr[low] && key <= arr[high]){

        if(low === high){
            if(arr[low] === key)
                return low;
            return -1;
        }

        let pos = low + Math.floor(
            ((key - arr[low]) * (high - low)) /
            (arr[high] - arr[low])
        );

        if(arr[pos] === key)
            return pos;

        if(arr[pos] < key)
            low = pos + 1;
        else
            high = pos - 1;
    }

    return -1;
}

function searchElement(){

    let arrayInput = document.getElementById("array").value;
    let key = Number(document.getElementById("key").value);

    if(arrayInput.trim() === ""){
        alert("Please enter the array.");
        return;
    }

    let arr = arrayInput.split(",").map(Number);

    let index = interpolationSearch(arr,key);

    if(index == -1){
        document.getElementById("result").innerHTML =
        "❌ Element Not Found";
    }
    else{
        document.getElementById("result").innerHTML =
        "✅ Element Found at Index : " + index;
    }

}

function clearFields(){

    document.getElementById("array").value = "";
    document.getElementById("key").value = "";
    document.getElementById("result").innerHTML = "";

}

</script>

</body>
</html>
