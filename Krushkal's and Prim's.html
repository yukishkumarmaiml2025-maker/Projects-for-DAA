<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MST Visualizer - Kruskal & Prim</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{

    background:#eef2f7;

}

.container{

    width:90%;
    max-width:950px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 15px rgba(0,0,0,.2);

}

h1{

    text-align:center;

    color:#1d4ed8;

    margin-bottom:25px;

}

label{

    display:block;

    margin-top:18px;

    font-weight:bold;

}

input,textarea{

    width:100%;

    padding:12px;

    margin-top:8px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:16px;

}

textarea{

    resize:none;

}

.buttons{

    display:flex;

    gap:15px;

    margin-top:25px;

}

button{

    flex:1;

    padding:12px;

    border:none;

    border-radius:6px;

    color:white;

    font-size:16px;

    cursor:pointer;

}

#runBtn{

    background:#2563eb;

}

#clearBtn{

    background:#dc2626;

}

button:hover{

    opacity:.9;

}

.result{

    margin-top:30px;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}

th{

    background:#2563eb;

    color:white;

    padding:12px;

}

td{

    border:1px solid #ddd;

    padding:10px;

    text-align:center;

}

pre{

    background:#f4f4f4;

    padding:15px;

    border-radius:6px;

    margin-top:10px;

    overflow:auto;

}

</style>

</head>

<body>

<div class="container">

<h1>Minimum Spanning Tree Visualizer</h1>

<label>Number of Vertices</label>

<input
type="number"
id="vertices"
value="7">

<label>Enter Graph Edges (One Per Line)</label>

<textarea
id="edges"
rows="10">
0 1 7
0 3 5
1 2 8
1 3 9
1 4 7
2 4 5
3 4 15
3 5 6
4 5 8
4 6 9
5 6 11
</textarea>

<div class="buttons">

<button id="runBtn" onclick="runAlgorithms()">

Compare Algorithms

</button>

<button id="clearBtn" onclick="clearData()">

Clear

</button>

</div>

<div class="result">

<table>

<thead>

<tr>

<th>Algorithm</th>

<th>Total Cost</th>

</tr>

</thead>

<tbody>

<tr>

<td>Kruskal</td>

<td id="kCost">-</td>

</tr>

<tr>

<td>Prim</td>

<td id="pCost">-</td>

</tr>

</tbody>

</table>

<h2 style="margin-top:25px;color:#1d4ed8;">

Kruskal MST

</h2>

<pre id="kruskalOutput">

-

</pre>

<h2 style="margin-top:25px;color:#1d4ed8;">

Prim MST

</h2>

<pre id="primOutput">

-

</pre>

</div>

</div>

<script>
    // ======================================
// Parse Graph Input
// ======================================

function parseGraph() {

    const n = parseInt(document.getElementById("vertices").value);

    const lines = document.getElementById("edges").value
        .trim()
        .split("\n");

    const edges = [];
    const adj = {};

    for (let line of lines) {

        if (line.trim() === "") continue;

        let [u, v, w] = line.trim().split(/\s+/).map(Number);

        edges.push({u, v, w});

        if (!adj[u]) adj[u] = [];
        if (!adj[v]) adj[v] = [];

        adj[u].push({to: v, weight: w});
        adj[v].push({to: u, weight: w});

    }

    return { n, edges, adj };

}



// ======================================
// Union Find (Disjoint Set)
// ======================================

class UnionFind {

    constructor(n){

        this.parent = [];

        this.rank = [];

        for(let i=0;i<n;i++){

            this.parent[i]=i;

            this.rank[i]=0;

        }

    }

    find(x){

        if(this.parent[x]!==x){

            this.parent[x]=this.find(this.parent[x]);

        }

        return this.parent[x];

    }

    union(x,y){

        let rx=this.find(x);

        let ry=this.find(y);

        if(rx===ry) return false;

        if(this.rank[rx]<this.rank[ry]){

            [rx,ry]=[ry,rx];

        }

        this.parent[ry]=rx;

        if(this.rank[rx]===this.rank[ry]){

            this.rank[rx]++;

        }

        return true;

    }

}



// ======================================
// Kruskal Algorithm
// ======================================

function kruskal(n, edges){

    edges.sort((a,b)=>a.w-b.w);

    const uf = new UnionFind(n);

    const mst=[];

    let cost=0;

    for(const edge of edges){

        if(uf.union(edge.u,edge.v)){

            mst.push(edge);

            cost += edge.w;

        }

        if(mst.length===n-1){

            break;

        }

    }

    return {

        mst,

        cost

    };

}
// ======================================
// Prim's Algorithm
// ======================================

function prim(n, adj, start = 0){

    const visited = new Array(n).fill(false);

    const key = new Array(n).fill(Infinity);

    const parent = new Array(n).fill(-1);

    key[start] = 0;

    let mst = [];

    let cost = 0;

    for(let count = 0; count < n; count++){

        let u = -1;
        let min = Infinity;

        for(let i = 0; i < n; i++){

            if(!visited[i] && key[i] < min){

                min = key[i];
                u = i;

            }

        }

        if(u === -1) break;

        visited[u] = true;

        if(parent[u] !== -1){

            mst.push({
                u: parent[u],
                v: u,
                w: key[u]
            });

            cost += key[u];

        }

        if(adj[u]){

            for(const edge of adj[u]){

                if(!visited[edge.to] && edge.weight < key[edge.to]){

                    key[edge.to] = edge.weight;

                    parent[edge.to] = u;

                }

            }

        }

    }

    return {

        mst,

        cost

    };

}



// ======================================
// Run Both Algorithms
// ======================================

function runAlgorithms(){

    const graph = parseGraph();

    const k = kruskal(graph.n, [...graph.edges]);

    const p = prim(graph.n, graph.adj);

    document.getElementById("kCost").innerHTML = k.cost;

    document.getElementById("pCost").innerHTML = p.cost;

    let kText = "";

    for(const e of k.mst){

        kText += `Edge (${e.u} - ${e.v})   Weight : ${e.w}\n`;

    }

    kText += "\nTotal Cost : " + k.cost;

    document.getElementById("kruskalOutput").textContent = kText;



    let pText = "";

    for(const e of p.mst){

        pText += `Edge (${e.u} - ${e.v})   Weight : ${e.w}\n`;

    }

    pText += "\nTotal Cost : " + p.cost;

    document.getElementById("primOutput").textContent = pText;

}



// ======================================
// Clear
// ======================================

function clearData(){

    document.getElementById("vertices").value = "";

    document.getElementById("edges").value = "";

    document.getElementById("kCost").innerHTML = "-";

    document.getElementById("pCost").innerHTML = "-";

    document.getElementById("kruskalOutput").textContent = "-";

    document.getElementById("primOutput").textContent = "-";

}

</script>

</body>
</html>
