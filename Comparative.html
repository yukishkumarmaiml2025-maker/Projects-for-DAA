<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Matching Algorithm Visualizer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#eef2f7;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

textarea,
input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

textarea{
    resize:none;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:15px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#runBtn{
    background:#2563eb;
}

#clearBtn{
    background:#dc2626;
}

button:hover{
    opacity:.9;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    text-align:center;
    padding:10px;
    border:1px solid #ddd;
}

.result{
    margin-top:25px;
}

h2{
    margin-top:20px;
    color:#1e3a8a;
}

</style>
</head>

<body>

<div class="container">

<h1>String Matching Algorithm Comparison</h1>

<label>Enter Text</label>

<textarea id="text" rows="5">AABAACAADAABAABA</textarea>

<label>Enter Pattern</label>

<input
type="text"
id="pattern"
value="AABA">

<div class="buttons">

<button id="runBtn" onclick="runAlgorithms()">
Compare Algorithms
</button>

<button id="clearBtn" onclick="clearData()">
Clear
</button>

</div>

<div class="result">

<table>

<thead>

<tr>

<th>Algorithm</th>
<th>Matches</th>
<th>Comparisons</th>
<th>Execution Time (ms)</th>

</tr>

</thead>

<tbody>

<tr>

<td>Naive Search</td>

<td id="naiveMatch">-</td>

<td id="naiveComp">-</td>

<td id="naiveTime">-</td>

</tr>

<tr>

<td>KMP</td>

<td id="kmpMatch">-</td>

<td id="kmpComp">-</td>

<td id="kmpTime">-</td>

</tr>

<tr>

<td>Rabin-Karp</td>

<td id="rkMatch">-</td>

<td id="rkComp">-</td>

<td id="rkTime">-</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>
    // ------------------------
// Naive Search Algorithm
// ------------------------

function naiveSearch(text, pattern){

    let n = text.length;
    let m = pattern.length;

    let matches = [];
    let comparisons = 0;

    for(let i = 0; i <= n - m; i++){

        let j = 0;

        while(j < m){

            comparisons++;

            if(text[i + j] !== pattern[j]){
                break;
            }

            j++;
        }

        if(j === m){
            matches.push(i);
        }

    }

    return {
        matches,
        comparisons
    };

}

// ------------------------
// Compute LPS Array
// ------------------------

function computeLPS(pattern){

    let m = pattern.length;

    let lps = new Array(m).fill(0);

    let length = 0;

    let i = 1;

    while(i < m){

        if(pattern[i] === pattern[length]){

            length++;

            lps[i] = length;

            i++;

        }

        else{

            if(length !== 0){

                length = lps[length - 1];

            }

            else{

                lps[i] = 0;

                i++;

            }

        }

    }

    return lps;

}

// ------------------------
// KMP Search Algorithm
// ------------------------

function kmpSearch(text, pattern){

    let n = text.length;

    let m = pattern.length;

    let lps = computeLPS(pattern);

    let matches = [];

    let comparisons = 0;

    let i = 0;

    let j = 0;

    while(i < n){

        comparisons++;

        if(text[i] === pattern[j]){

            i++;

            j++;

        }

        if(j === m){

            matches.push(i - j);

            j = lps[j - 1];

        }

        else if(i < n && text[i] !== pattern[j]){

            if(j !== 0){

                j = lps[j - 1];

            }

            else{

                i++;

            }

        }

    }

    return {

        matches,

        comparisons

    };

}// ------------------------
// Rabin-Karp Algorithm
// ------------------------

function rabinKarp(text, pattern){

    let n = text.length;
    let m = pattern.length;

    const d = 256;
    const q = 101;

    let h = 1;

    for(let i = 0; i < m - 1; i++){
        h = (h * d) % q;
    }

    let pHash = 0;
    let tHash = 0;

    let matches = [];
    let comparisons = 0;

    for(let i = 0; i < m; i++){

        pHash = (d * pHash + pattern.charCodeAt(i)) % q;
        tHash = (d * tHash + text.charCodeAt(i)) % q;

    }

    for(let s = 0; s <= n - m; s++){

        if(pHash === tHash){

            let match = true;

            for(let k = 0; k < m; k++){

                comparisons++;

                if(text[s+k] !== pattern[k]){
                    match = false;
                    break;
                }

            }

            if(match){
                matches.push(s);
            }

        }

        if(s < n-m){

            tHash = (d * (tHash - text.charCodeAt(s) * h)
                    + text.charCodeAt(s+m)) % q;

            if(tHash < 0){
                tHash += q;
            }

        }

    }

    return{

        matches,

        comparisons

    };

}


// ------------------------
// Run All Algorithms
// ------------------------

function runAlgorithms(){

    let text = document.getElementById("text").value;
    let pattern = document.getElementById("pattern").value;

    if(text.length === 0 || pattern.length === 0){

        alert("Please enter both Text and Pattern.");

        return;

    }

    // Naive

    let start = performance.now();

    let naive = naiveSearch(text,pattern);

    let end = performance.now();

    document.getElementById("naiveMatch").innerHTML =
        naive.matches.length ? naive.matches.join(", ") : "No Match";

    document.getElementById("naiveComp").innerHTML =
        naive.comparisons;

    document.getElementById("naiveTime").innerHTML =
        (end-start).toFixed(4);



    // KMP

    start = performance.now();

    let kmp = kmpSearch(text,pattern);

    end = performance.now();

    document.getElementById("kmpMatch").innerHTML =
        kmp.matches.length ? kmp.matches.join(", ") : "No Match";

    document.getElementById("kmpComp").innerHTML =
        kmp.comparisons;

    document.getElementById("kmpTime").innerHTML =
        (end-start).toFixed(4);



    // Rabin-Karp

    start = performance.now();

    let rk = rabinKarp(text,pattern);

    end = performance.now();

    document.getElementById("rkMatch").innerHTML =
        rk.matches.length ? rk.matches.join(", ") : "No Match";

    document.getElementById("rkComp").innerHTML =
        rk.comparisons;

    document.getElementById("rkTime").innerHTML =
        (end-start).toFixed(4);

}



// ------------------------
// Clear
// ------------------------

function clearData(){

    document.getElementById("text").value="";
    document.getElementById("pattern").value="";

    document.getElementById("naiveMatch").innerHTML="-";
    document.getElementById("naiveComp").innerHTML="-";
    document.getElementById("naiveTime").innerHTML="-";

    document.getElementById("kmpMatch").innerHTML="-";
    document.getElementById("kmpComp").innerHTML="-";
    document.getElementById("kmpTime").innerHTML="-";

    document.getElementById("rkMatch").innerHTML="-";
    document.getElementById("rkComp").innerHTML="-";
    document.getElementById("rkTime").innerHTML="-";

}

</script>

</body>
</html>
